services:
  web:
    image: ${CATCAFE_IMAGE:?Set CATCAFE_IMAGE to the published image name and tag}
    ports:
      - target: 80
        published: 8080
        protocol: tcp
        mode: ingress
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        order: start-first
      rollback_config:
        parallelism: 1
        order: stop-first
